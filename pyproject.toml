[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-radial-stress-method"
version = "1.0.0"
description = "Enhanced Radial Stress Method for the Vierendeel bending design of perforated steel beams with circular or elliptical openings."
readme = "README.md"
requires-python = ">=3.9"
license-files = ["LICENSE"]
authors = [
    # REPLACE both fields with your name and institutional e-mail address.
    { name = "Georgios Psyrras", email = "giorgos.psyrras@city.ac.uk" },
]
keywords = [
    "structural engineering",
    "steel design",
    "cellular beams",
    "Enhanced RSM",
    "Enhanced Radial Stress Method",
    "web openings",
    "Vierendeel bending",
    "Eurocode 3",
    "EN 1993-1-13",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/PsyrrasG/enhanced-radial-stress-method"
Repository = "https://github.com/PsyrrasG/enhanced-radial-stress-method"

[project.scripts]
enhanced-rsm = "enhanced_rsm.cli:main"

[tool.setuptools.packages.find]
include = ["enhanced_rsm*"]
